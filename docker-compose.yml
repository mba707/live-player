services:
  live-player:
    container_name: live-player
    build: .
    restart: unless-stopped
    ports:
      - "8112:8112"
      - "8888-8897:8888-8897"
    environment:
      - TZ=America/Chicago
      - PUBLIC_HOST=192.168.50.49
      - PUBLIC_PORT=8112
      - DATA_FILE=/data/livestreams.json
      - POLL_SECONDS=60
      - STREAM_PORT_START=8888
      - STREAM_PORT_END=8897
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8112/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
